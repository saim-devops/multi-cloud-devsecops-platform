# Helm Values for kube-prometheus-stack
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    network: true
    node: true
    prometheus: true

alertmanager:
  alertmanagerSpec:
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/REPLACE_WITH_YOUR_SLACK_WEBHOOK"
      pagerduty_url: "https://events.pagerduty.com/v2/enqueue"
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'pagerduty-and-slack'
      routes:
        - match:
            severity: critical
          receiver: 'pagerduty-and-slack'
        - match:
            severity: warning
          receiver: 'slack-notifications'
    receivers:
      - name: 'pagerduty-and-slack'
        pagerduty_configs:
          - routing_key: "REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY"
            send_resolved: true
        slack_configs:
          - channel: '#alerts-devsecops-prod'
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ template "slack.default.text" . }}'
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#alerts-devsecops-prod'
            send_resolved: true

server:
  retention: 15d

grafana:
  enabled: true
  adminPassword: "AdminDevSecOpsSecure2026!"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  ingress:
    enabled: false

prometheus:
  prometheusSpec:
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

prometheusOperator:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  admissionWebhooks:
    patch:
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"

kube-state-metrics:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

prometheus-node-exporter:
  tolerations:
    - operator: "Exists"
