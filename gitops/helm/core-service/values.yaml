# Baseline values for core-service
replicaCount: 2

cloudProvider: "generic"
environment: "production"

image:
  repository: ghcr.io/enterprise/core-service
  pullPolicy: IfNotPresent
  tag: "a2fa9502cef3a5d832858aa5bb444287026a07ac"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "core-service"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: core-service.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

keyVaultCsi:
  enabled: false
  provider: azure
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  secretObjects: []

env:
  - name: PORT
    value: "8080"
  - name: LOG_LEVEL
    value: "info"
