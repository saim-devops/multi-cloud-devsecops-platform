# GCP GKE Specific Overlays
cloudProvider: "GCP"
environment: "production"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "core-service-sa@enterprise-devsecops.iam.gserviceaccount.com"

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: "core-service-gcp-cert"
    networking.gke.io/v1beta1.FrontendConfig: "core-service-frontend-config"
  hosts:
    - host: "core-service.gcp.enterprise-devsecops.com"
      paths:
        - path: /
          pathType: Prefix

env:
  - name: CLOUD_PROVIDER
    value: "GCP"
  - name: CLUSTER_NAME
    value: "gke-production-cluster"
  - name: PORT
    value: "8080"
