# AWS EKS Specific Overlays
cloudProvider: "AWS"
environment: "production"

image:
  repository: 336425344916.dkr.ecr.us-east-1.amazonaws.com/core-service
  tag: "a43a30c8bd312f6f9f79cf58af9fcadf140765bf"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::336425344916:role/multi-cloud-eks-prod-core-service-irsa-role"

ingress:
  enabled: false

env:
  - name: CLOUD_PROVIDER
    value: "AWS"
  - name: CLUSTER_NAME
    value: "eks-production-cluster"
  - name: PORT
    value: "8080"
