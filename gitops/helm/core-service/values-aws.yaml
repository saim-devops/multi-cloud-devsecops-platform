# AWS EKS Specific Overlays
cloudProvider: "AWS"
environment: "production"

image:
  repository: 336425344916.dkr.ecr.us-east-1.amazonaws.com/core-service
  tag: "a43a30c8bd312f6f9f79cf58af9fcadf140765bf"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::336425344916:role/multi-cloud-eks-prod-core-service-irsa-role"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: aws.saimm.online
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aws-saimm-online-tls
      hosts:
        - aws.saimm.online

env:
  - name: CLOUD_PROVIDER
    value: "AWS"
  - name: CLUSTER_NAME
    value: "eks-production-cluster"
  - name: PORT
    value: "8080"
