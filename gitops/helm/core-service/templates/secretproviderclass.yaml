{{- if .Values.keyVaultCsi.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "core-service.fullname" . }}-spc
  labels:
    {{- include "core-service.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.keyVaultCsi.provider }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVaultCsi.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.keyVaultCsi.keyvaultName | quote }}
    tenantId: {{ .Values.keyVaultCsi.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: DB-PASSWORD
          objectType: secret
          objectVersion: ""
  secretObjects:
    {{- toYaml .Values.keyVaultCsi.secretObjects | nindent 4 }}
{{- end }}
