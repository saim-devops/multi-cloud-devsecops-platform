# Azure AKS Specific Overlays
cloudProvider: "Azure"
environment: "production"

image:
  repository: acrsaimdevsecopsprod.azurecr.io/core-service
  tag: "c8f6937dc306eede10cb99d629f9c25e71a5176f"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "6c55814a-9ec3-4533-9a16-ac76d1e31d39"

ingress:
  enabled: false

keyVaultCsi:
  enabled: true
  provider: azure
  keyvaultName: "kv-saim-devsecops-prod"
  tenantId: "f64aa331-c257-49e7-a9f2-a2e997d84429"
  userAssignedIdentityID: "af658475-0ee5-471c-9e31-f5d600bb2d76"
  secretObjects:
    - secretName: "db-credentials"
      type: "Opaque"
      data:
        - objectName: "DB-PASSWORD"
          key: "password"

env:
  - name: CLOUD_PROVIDER
    value: "Azure"
  - name: CLUSTER_NAME
    value: "aks-production-cluster"
  - name: PORT
    value: "8080"
