# Azure AKS Specific Overlays
cloudProvider: "Azure"
environment: "production"

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/health-probe-path: "/healthz"
    appgw.ingress.kubernetes.io/cookie-based-affinity: "false"
  hosts:
    - host: "core-service.azure.enterprise-devsecops.com"
      paths:
        - path: /
          pathType: Prefix

keyVaultCsi:
  enabled: true
  provider: azure
  keyvaultName: "kv-core-service-prod"
  tenantId: "11111111-1111-1111-1111-111111111111"
  userAssignedIdentityID: "22222222-2222-2222-2222-222222222222"
  secretObjects:
    - secretName: "db-credentials"
      type: "Opaque"
      data:
        - objectName: "DB-PASSWORD"
          key: "password"

env:
  - name: CLOUD_PROVIDER
    value: "Azure"
  - name: CLUSTER_NAME
    value: "aks-production-cluster"
  - name: PORT
    value: "8080"
