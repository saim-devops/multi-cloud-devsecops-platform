# Azure AKS Specific Overlays
cloudProvider: "Azure"
environment: "production"

image:
  repository: acrsaimdevsecopsprod.azurecr.io/core-service
  tag: "a2fa9502cef3a5d832858aa5bb444287026a07ac"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "6c55814a-9ec3-4533-9a16-ac76d1e31d39"

ingress:
  enabled: false

keyVaultCsi:
  enabled: false
  provider: azure
  keyvaultName: "kv-saim-devsecops-prod"
  tenantId: "f64aa331-c257-49e7-a9f2-a2e997d84429"
  userAssignedIdentityID: "00000000-0000-0000-0000-000000000000"
  secretObjects:
    - secretName: "db-credentials"
      type: "Opaque"
      data:
        - objectName: "DB-PASSWORD"
          key: "password"

env:
  - name: CLOUD_PROVIDER
    value: "Azure"
  - name: CLUSTER_NAME
    value: "aks-production-cluster"
  - name: PORT
    value: "8080"
