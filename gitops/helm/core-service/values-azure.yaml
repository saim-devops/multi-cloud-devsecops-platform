# Azure AKS Specific Overlays
cloudProvider: "Azure"
environment: "production"

image:
  repository: acrsaimdevsecopsprod.azurecr.io/core-service
  tag: "a43a30c8bd312f6f9f79cf58af9fcadf140765bf"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "6c55814a-9ec3-4533-9a16-ac76d1e31d39"

ingress:
  enabled: false

keyVaultCsi:
  enabled: true
  provider: azure
  keyvaultName: "kv-saim-devsecops-prod"
  tenantId: "f64aa331-c257-49e7-a9f2-a2e997d84429"
  userAssignedIdentityID: "1787298f-88a5-4b69-b7b1-eea4b4f49d5c"
  secretObjects:
    - secretName: "db-credentials"
      type: "Opaque"
      data:
        - objectName: "DB-PASSWORD"
          key: "password"

env:
  - name: CLOUD_PROVIDER
    value: "Azure"
  - name: CLUSTER_NAME
    value: "aks-production-cluster"
  - name: PORT
    value: "8080"
