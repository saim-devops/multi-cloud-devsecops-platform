name: "CI/CD & DevSecOps Shift-Left Pipeline"

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - ".github/workflows/ci-devsecops.yml"
      - "security/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - ".github/workflows/ci-devsecops.yml"
      - "security/**"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  id-token: write
  packages: write

env:
  IMAGE_NAME: core-service
  AWS_REGION: us-east-1
  GCP_REGION: us-central1
  AZURE_LOCATION: eastus

jobs:
  # =========================================================================
  # 1. Code Quality & Unit Testing
  # =========================================================================
  lint-and-test:
    name: "Lint & Unit Testing"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Run Go Vet & Format Check
        run: |
          cd app
          go vet ./...
          test -z "$(gofmt -s -l .)" || (echo "Code not formatted, run gofmt" && exit 1)

      - name: Run Unit Tests with Coverage
        run: |
          cd app
          go test -v -race -coverprofile=../coverage.out ./src/...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out

  # =========================================================================
  # 2. Static Application Security Testing (SAST) - SonarQube
  # =========================================================================
  sonarqube-sast:
    name: "SonarQube SAST Quality Gate"
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true # Allows workflow to pass in environments without live SonarQube server

  # =========================================================================
  # 3. Docker Build & Trivy Vulnerability Security Gate
  # =========================================================================
  build-and-trivy-scan:
    name: "Build Container & Trivy Vulnerability Gate"
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Vulnerability Scan (SARIF Report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy Vulnerability Gate (Fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Enforces the Shift-Left security gate
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # =========================================================================
  # 4. Multi-Cloud Registry Publishing (AWS ECR + GCP AR + Azure ACR)
  # =========================================================================
  publish-multi-cloud:
    name: "Publish to AWS ECR, GCP AR & Azure ACR"
    needs: build-and-trivy-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- GitHub Container Registry (Baseline Mirror) ---
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      # --- AWS ECR Publishing (via Access Keys or OIDC) ---
      - name: Configure AWS Credentials
        if: "${{ env.AWS_ACCOUNT_ID != '' }}"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsMultiCloudEcrSession

      - name: Login to Amazon ECR
        if: "${{ env.AWS_ACCOUNT_ID != '' }}"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to AWS ECR
        if: "${{ env.AWS_ACCOUNT_ID != '' }}"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push $REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # --- Google Cloud Artifact Registry Publishing (via Workload Identity) ---
      - name: Authenticate to Google Cloud
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Google Artifact Registry
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Push Image to GCP Artifact Registry
        if: "${{ env.GCP_PROJECT_ID != '' }}"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          GCP_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/core-registry/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $GCP_IMAGE
          docker push $GCP_IMAGE

      # --- Azure Container Registry Publishing (via Azure Login) ---
      - name: Azure Login
        if: "${{ env.AZURE_CLIENT_ID != '' }}"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: "${{ env.AZURE_CLIENT_ID != '' }}"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Push Image to Azure ACR
        if: "${{ env.AZURE_CLIENT_ID != '' }}"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          ACR_IMAGE="${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $ACR_IMAGE
          docker push $ACR_IMAGE

  # =========================================================================
  # 5. GitOps Automation: Commit New Image Tag to Argo CD Repo
  # =========================================================================
  gitops-sync:
    name: "GitOps Manifest Update (Argo CD Trigger)"
    needs: publish-multi-cloud
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values.yaml with New Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' gitops/helm/core-service/values.yaml

      - name: Commit and Push GitOps Manifest Change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/helm/core-service/values.yaml
          if git diff --staged --quiet; then
            echo "No change in GitOps tag. Skipping commit."
          else
            git commit -m "chore(gitops): auto-promote core-service image tag to ${{ github.sha }} [skip ci]"
            git push origin main
          fi
